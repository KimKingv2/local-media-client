name: Build installable previews

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_cleartext_webdav:
        description: "Allow plain HTTP WebDAV (trusted LAN only; HTTPS is strongly preferred)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-preview:
    name: Android TV / Phone / Tablet APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Reconstruct and extract Flutter source
        run: python3 source/reconstruct_source.py --output app-src

      - name: Test platform configuration tooling
        run: python3 -m unittest discover -s app-src/test/tooling -p 'test_*.py' -v

      - name: Export patched Flutter source for playback integration
        uses: actions/upload-artifact@v4
        with:
          name: local-media-client-patched-source
          path: |
            app-src/lib/
            app-src/test/
            app-src/pubspec.yaml
            app-src/tool/
          if-no-files-found: error
          retention-days: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true
          pub-cache: true

      - name: Keep informational analyzer hints non-fatal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          scripts = [
              Path("app-src/tool/build_android_preview.sh"),
              Path("app-src/tool/build_macos_preview.sh"),
          ]
          command = re.compile(r"\bflutter\s+analyze\b")
          for path in scripts:
              content = path.read_text(encoding="utf-8")
              if "--no-fatal-infos" not in content:
                  updated, count = command.subn(
                      "flutter analyze --no-fatal-infos", content
                  )
                  if count == 0:
                      raise SystemExit(f"Could not find flutter analyze command in {path}")
                  path.write_text(updated, encoding="utf-8")
              print(f"Confirmed --no-fatal-infos in {path}")
          PY

      - name: Build and test Android preview
        env:
          ALLOW_CLEARTEXT_WEB_DAV: ${{ github.event_name == 'push' && '1' || (inputs.allow_cleartext_webdav && '1' || '0') }}
        run: cd app-src && ./tool/build_android_preview.sh

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: local-media-android-preview
          path: |
            app-src/dist/local_media_client_android_preview.apk
            app-src/dist/local_media_client_android_preview.apk.sha256
          if-no-files-found: error
          retention-days: 30

  macos-preview:
    name: macOS app preview
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Reconstruct and extract Flutter source
        run: python3 source/reconstruct_source.py --output app-src

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true
          pub-cache: true

      - name: Keep informational analyzer hints non-fatal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          scripts = [
              Path("app-src/tool/build_android_preview.sh"),
              Path("app-src/tool/build_macos_preview.sh"),
          ]
          command = re.compile(r"\bflutter\s+analyze\b")
          for path in scripts:
              content = path.read_text(encoding="utf-8")
              if "--no-fatal-infos" not in content:
                  updated, count = command.subn(
                      "flutter analyze --no-fatal-infos", content
                  )
                  if count == 0:
                      raise SystemExit(f"Could not find flutter analyze command in {path}")
                  path.write_text(updated, encoding="utf-8")
              print(f"Confirmed --no-fatal-infos in {path}")
          PY

      - name: Build and test macOS preview
        env:
          ALLOW_CLEARTEXT_WEB_DAV: ${{ github.event_name == 'push' && '1' || (inputs.allow_cleartext_webdav && '1' || '0') }}
        run: cd app-src && ./tool/build_macos_preview.sh

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: local-media-macos-preview
          path: app-src/dist/local_media_client_macos_preview.zip
          if-no-files-found: error
          retention-days: 30
