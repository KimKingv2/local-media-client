name: Build installable previews

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_cleartext_webdav:
        description: "Allow plain HTTP WebDAV (trusted LAN only; HTTPS is strongly preferred)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-preview:
    name: Android TV / Phone / Tablet APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Flutter source
        run: |
          mkdir -p app-src
          gzip -t source/local-media-client-source.tar.gz
          tar -xzf source/local-media-client-source.tar.gz -C app-src
          test -f app-src/pubspec.yaml
          test -x app-src/tool/build_android_preview.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true
          pub-cache: true

      - name: Build and test Android preview
        env:
          ALLOW_CLEARTEXT_WEB_DAV: ${{ inputs.allow_cleartext_webdav && '1' || '0' }}
        run: cd app-src && ./tool/build_android_preview.sh

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: local-media-android-preview
          path: |
            app-src/dist/local_media_client_android_preview.apk
            app-src/dist/local_media_client_android_preview.apk.sha256
          if-no-files-found: error
          retention-days: 30

  macos-preview:
    name: macOS app preview
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Extract Flutter source
        run: |
          mkdir -p app-src
          gzip -t source/local-media-client-source.tar.gz
          tar -xzf source/local-media-client-source.tar.gz -C app-src
          test -f app-src/pubspec.yaml
          test -x app-src/tool/build_macos_preview.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true
          pub-cache: true

      - name: Build and test macOS preview
        env:
          ALLOW_CLEARTEXT_WEB_DAV: ${{ inputs.allow_cleartext_webdav && '1' || '0' }}
        run: cd app-src && ./tool/build_macos_preview.sh

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: local-media-macos-preview
          path: app-src/dist/local_media_client_macos_preview.zip
          if-no-files-found: error
          retention-days: 30
